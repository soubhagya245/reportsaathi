name: CI Pipeline

on:
  push:
    branches: [main, staging, "task-*"]
  pull_request:
    branches: [main, staging]

jobs:
  shared-check:
    name: Shared Contracts Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: shared/package.json

      - name: Install Dependencies
        run: npm --prefix shared install

      - name: Run TypeScript Check
        run: npm --prefix shared run typecheck

  backend-check:
    name: Backend Lint, Type Check & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Lint
        run: ruff check backend

      - name: Run Mypy Type Check
        run: mypy --config-file backend/pyproject.toml backend

      - name: Run Pytest Suite & Automated Smoke Tests
        env:
          PYTHONPATH: .
        run: pytest backend/tests -v

  frontend-check:
    name: Frontend Lint, Type Check, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm --prefix frontend ci

      - name: Run ESLint
        run: npm --prefix frontend run lint

      - name: Run Type Check
        run: npm --prefix frontend run typecheck

      - name: Run Vitest Unit Tests
        run: npm --prefix frontend run test

      - name: Build Production Assets
        run: npm --prefix frontend run build
