name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Build & Deploy Staging Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.staging.yml config

      - name: Build Backend & Frontend Staging Images
        run: docker compose -f docker-compose.staging.yml build

